<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-Commerce | Login</title><link rel="stylesheet" href="css/styles.css"></head>
<body>
<header><div class="container nav"><a class="logo" href="index.html">E-Commerce</a><nav><a href="index.html">Inicio</a><a href="login.html">Login</a><a href="admin.html">Administración</a></nav></div></header>
<main class="center"><section class="card form-card"><h1>Iniciar sesión</h1><form id="loginForm">
<label for="email">Correo electrónico</label><input id="email" type="email" required>
<small id="emailError" class="error"></small>

<button class="btn" type="submit">Ingresar</button></form><p id="loginMessage"></p></section></main>
<footer><p>Proyecto E-Commerce · Formación SENA</p></footer><script src="js/app.js"></script>

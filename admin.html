<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-Commerce | Administración</title><link rel="stylesheet" href="css/styles.css"></head>
<body>
<header><div class="container nav"><a class="logo" href="index.html">E-Commerce</a><nav><a href="index.html">Inicio</a><a href="login.html">Login</a><a href="admin.html">Administración</a></nav></div></header>
<main class="container section"><h1>Panel administrativo</h1><div class="admin">
<section class="card form-card"><h2>Registrar producto</h2><form id="productForm">
<label for="productName">Nombre</label><input id="productName" required>
<label for="productPrice">Precio</label><input id="productPrice" type="number" min="1" required>
<label for="productDescription">Descripción</label><textarea id="productDescription" required></textarea>
<button class="btn" type="submit">Guardar producto</button></form><p id="adminMessage"></p></section>
<section class="card"><h2>Productos registrados</h2><div id="adminProductList"></div></section>
</div></main><footer><p>Proyecto E-Commerce · Formación SENA</p></footer><script src="js/app.js"></script>

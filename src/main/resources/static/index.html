<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>E-Commerce SENA</title><link rel="stylesheet" href="/styles.css"></head><body><main>
<h1>E-Commerce | Administración de productos</h1><p>Saleth Alejandro Parada Monroy · Spring Boot + JDBC + MySQL</p>
<section><h2>Registrar o editar producto</h2><form id="form">
<input type="hidden" id="id"><label>Nombre<input id="name" maxlength="120" required></label>
<label>Descripción<input id="description" maxlength="255" required></label>
<label>Precio<input id="price" type="number" step="0.01" min="0.01" required></label>
<label>Existencias<input id="stock" type="number" min="0" required></label>
<label><input type="checkbox" id="active" checked> Activo</label>
<button>Guardar</button><button type="button" id="cancel">Cancelar edición</button>
</form></section><section><h2>Listado de productos</h2><p id="status" role="status"></p><div id="products"></div></section>
</main><script src="/app.js"></script></body></html>
